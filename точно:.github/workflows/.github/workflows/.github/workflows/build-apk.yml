name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build Pogonya.apk (debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager not found, relying on the preinstalled SDK"
          fi
          exit 0

      - name: Install npm packages
        run: npm install

      - name: Add Android platform (only if there is no android folder)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK (Gradle)
        working-directory: android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Package Pogonya.apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found. Contents of build outputs:"
            find android/app/build/outputs || true
            exit 1
          fi
          cp "$APK" Pogonya.apk
          ls -l Pogonya.apk

      - name: Upload Pogonya.apk
        uses: actions/upload-artifact@v7
        with:
          name: App-apk
          path: Pogonya.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log (if something failed)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-android
          path: gradle-build.log
          if-no-files-found: ignore
